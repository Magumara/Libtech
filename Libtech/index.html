                    <h2 data-lang="fr">La plateforme de référence pour les technologies d'assistance</h2>
                    <h2 data-lang="en">The reference platform for assistive technologies</h2>
                    <p data-lang="fr">LibTech est une plateforme collaborative dédiée aux technologies d’assistance, développée dans le cadre du Master TECH de l’Université de Bordeaux. Elle vise à rendre plus accessibles les solutions d’assistance existantes en proposant un répertoire clair, actualisé et pensé pour tous.</p>
                    <p data-lang="en">LibTech is a collaborative platform dedicated to assistive technologies, developed within the TECH Master at the University of Bordeaux. It aims to make existing assistive solutions more accessible by offering a clear, up-to-date directory designed for everyone.</p>
                    <form id="homeSearchForm" class="search-wrap" role="search">

                <p data-lang="fr">Où que vous soyez, si vous avez une question sur LibTech, une suggestion de technologie d’assistance ou une correction à proposer, n’hésitez pas à nous écrire. Nous serons ravis d’échanger avec vous.</p>

    <template id="view-submit">
        <section class="page article">
            <div class="hero">
                <h2 data-lang="fr">Soumettre une technologie</h2>
                <h2 data-lang="en">Submit a technology</h2>
            </div>
            <div class="section">
                <p data-lang="fr">Cette section permet de proposer une nouvelle technologie d’assistance à intégrer dans le répertoire LibTech. Remplissez le formulaire ci-dessous, notre équipe examinera votre dossier et vous répondra le plus rapidement possible.</p>
                <p data-lang="en">Use this section to propose a new assistive technology to be added to the LibTech directory. Fill in the form below and our team will review your submission and get back to you as soon as possible.</p>
            </div>
            <form id="soumettreForm" class="section soumettre-form">
                <h3 data-lang="fr">Informations sur votre technologie</h3>
                <h3 data-lang="en">Information about your technology</h3>
                <label><span data-lang="fr">Nom de la technologie*</span><span data-lang="en">Name of the technology*</span><input name="tech_name" type="text" required></label>
                <label><span data-lang="fr">Description rapide*</span><span data-lang="en">Short description*</span><input name="tech_desc" type="text" required></label>
                <label><span data-lang="fr">Site web</span><span data-lang="en">Website</span><input name="tech_url" type="url"></label>
                <label><span data-lang="fr">Type de technologie*</span><span data-lang="en">Type of technology*</span><input name="tech_type" type="text" data-placeholder-fr="Application, logiciel, plateforme en ligne, robot..." data-placeholder-en="App, software, online platform, robot..." required></label>
                <label><span data-lang="fr">Public visé*</span><span data-lang="en">Target users*</span><input name="tech_target" type="text" data-placeholder-fr="Tout public, enfant, adulte, personne âgée..." data-placeholder-en="General public, children, adults, older adults..." required></label>
                <label><span data-lang="fr">Prix*</span><span data-lang="en">Price*</span><input name="tech_price" type="text" data-placeholder-fr="Gratuit, payant, sur devis..." data-placeholder-en="Free, paid, on quotation..." required></label>
                <label><span data-lang="fr">Disponibilité*</span><span data-lang="en">Availability*</span><input name="tech_availability" type="text" data-placeholder-fr="Sur le marché, en cours de développement" data-placeholder-en="On the market, in development..." required></label>
                <h3 data-lang="fr">Informations sur votre entreprise</h3>
                <h3 data-lang="en">Information about your company</h3>
                <label><span data-lang="fr">Nom de l'entreprise*</span><span data-lang="en">Company name*</span><input name="company_name" type="text" required></label>
                <label><span data-lang="fr">Nom de contact*</span><span data-lang="en">Contact person*</span><input name="contact_name" type="text" required></label>
                <label><span data-lang="fr">Numéro de Siret*</span><span data-lang="en">SIRET number*</span><input name="siret" type="text" required></label>
                <label><span>Email*</span><input name="email" type="email" required></label>
                <div class="submit-row"><button class="btn submit-btn" type="submit"><span data-lang="fr">Envoyer</span><span data-lang="en">Send</span></button></div>
            </form>
            <div id="soumettreModal" class="modal hidden">
                <div class="modal-box">
                    <p><strong data-lang="fr">Merci ! Votre technologie a bien été soumise. L’équipe LibTech vous contactera si nécessaire.</strong><strong data-lang="en">Thank you! Your technology has been submitted. The LibTech team will contact you if necessary.</strong></p>
                    <button id="closeModal" class="btn"><span data-lang="fr">Fermer</span><span data-lang="en">Close</span></button>
                </div>
            </div>
        </section>
    </template>

    <template id="view-about">
        <section class="page article">
            <div class="hero"><h2><span data-lang="fr">À propos</span><span data-lang="en">About</span></h2></div>
            <div class="section">
                <p data-lang="fr">LibTech est une plateforme collaborative dédiée aux technologies d’assistance, développée dans le cadre du Master TECH de l’Université de Bordeaux. Elle vise à rendre plus accessibles les solutions d’assistance existantes en proposant un répertoire clair, actualisé et pensé pour tous.</p>
                <p data-lang="en">LibTech is a collaborative platform dedicated to assistive technologies, developed within the TECH Master at the University of Bordeaux. It aims to make existing assistive solutions more accessible by offering a clear, up-to-date directory designed for everyone.</p>
            </div>
            <div class="about-highlight">
                <div class="about-columns">
                    <div>
                        <h3>Mission</h3>
                        <p data-lang="fr">Notre mission est de faciliter l’accès à l’information sur les technologies d’assistance en proposant un répertoire structuré, fiable et simple à explorer. Nous souhaitons soutenir les étudiants, professionnels, aidants et toute personne concernée par le handicap dans la découverte d’outils adaptés.</p>
                        <p data-lang="en">Our mission is to make information about assistive technologies easier to access by offering a structured, reliable and easy-to-explore directory. We aim to support students, professionals, caregivers and anyone concerned by disability in finding appropriate tools.</p>
                    </div>
                    <div>
                        <h3>Vision</h3>
                        <p data-lang="fr">Notre vision est de construire une ressource vivante et évolutive, améliorée chaque année par les nouvelles promotions du Master TECH. Nous imaginons une plateforme ouverte, durable et inclusive, qui accompagne l’innovation numérique et la conception accessible.</p>
                        <p data-lang="en">Our vision is to build a living, evolving resource, improved each year by new cohorts of the TECH Master. We imagine an open, sustainable and inclusive platform that accompanies digital innovation and accessible design.</p>
                    </div>
                </div>
            </div>
            <div class="section">
                <h3 data-lang="fr">Équipe et collaboration</h3><h3 data-lang="en">Team and collaboration</h3>
                <p data-lang="fr">Le projet LibTech est porté par les étudiants du parcours Technologies, Ergonomie, Cognition, Handicap (TECH). Chaque promotion contribue à la mise à jour du répertoire, au design du site et à l’accessibilité des contenus. Merci aux enseignants et aux partenaires pour leur accompagnement.</p>
                <p data-lang="en">The LibTech project is carried by students of the Technologies, Ergonomics, Cognition, Disability (TECH) track. Each cohort contributes to updating the directory, designing the site and improving content accessibility. We thank the lecturers and partners for their support.</p>
            </div>
            <div class="about-team">
                <section>
                    <h3 data-lang="fr">Équipe actuelle (Promotion 2025–2026)</h3><h3 data-lang="en">Current team (Class of 2025–2026)</h3>
                    <p data-lang="fr">Le développement de LibTech est assuré par la Promotion 2025–2026 du Master TECH à Université de Bordeaux. Cette promotion contribue à la mise à jour du répertoire et au changement d’hébergement du site, ainsi qu’à son développement.</p>
                    <p data-lang="en">The development of LibTech is currently ensured by the 2025–2026 cohort of the TECH Master at the University of Bordeaux. This cohort contributes to updating the directory, changing the site’s hosting and further developing the platform.</p>
                </section>
                <section>
                    <h3 data-lang="fr">Équipe précédente (Promotion 2024–2025)</h3><h3 data-lang="en">Previous team (Class of 2024–2025)</h3>
                    <p data-lang="fr">La promotion 2024–2025 a rendu LibTech fonctionnel. Nous les remercions chaleureusement pour leur contribution essentielle.</p>
                    <p data-lang="en">The 2024–2025 cohort made LibTech operational. We warmly thank them for their essential contribution.</p>
                </section>
                <section>
                    <h3 data-lang="fr">Encadrement</h3><h3 data-lang="en">Supervision</h3>
                    <p data-lang="fr">Le projet est encadré par l’équipe pédagogique du Master TECH, avec le soutien des enseignant·e·s et partenaires professionnels.</p>
                    <p data-lang="en">The project is supervised by the TECH Master teaching team, with the support of lecturers and professional partners.</p>
                </section>
            </div>
        </section>
    </template>

    <template id="view-privacy">
        <section class="page article">
            <div class="hero"><h2><span data-lang="fr">Politiques de confidentialité</span><span data-lang="en">Privacy policy</span></h2></div>
            <div class="section">
                <div data-lang="en">
                    <p class="meta">Last update: 2025</p>
                    <p>This policy explains how the LIBTECH site collects, uses and protects information about its visitors. It aims to ensure transparency and compliance with data-protection regulations. It does not constitute legal advice, and we recommend seeking professional counsel for specific questions.</p>
                    <p>LIBTECH is an academic project whose goal is to list inclusive technologies. You can browse the entire site without creating an account and without providing personal data.</p>
                    <h2>Information collected</h2><p>The site does not collect personal data for advertising or commercial purposes. Technical information such as IP address, time of connection or pages visited may be logged automatically by the servers of the University of Bordeaux for security and operational purposes. LIBTECH does not actively exploit these data and does not use them for individual tracking.</p>
                    <p>If you contact us by e-mail, we will receive your e-mail address and the content of your message.</p>
                    <h2>Collection methods</h2><p>There is no registration system on the site. The only personal information that may be collected is that which you voluntarily send us, mainly via e-mail.</p>
                    <h2>Storage and sharing of data</h2><p>The site is hosted by the IT resources center of the University of Bordeaux. Technical server information is managed in accordance with institutional practices.</p>
                    <p>E-mails we receive are processed solely in order to respond. No data is sold, transferred or shared with third parties, except where legally required.</p>
                    <h2>Communication with users</h2><p>We only contact you if you write to us. Exchanges are carried out exclusively by e-mail and only to answer your questions or comments.</p>
                    <h2>Cookies</h2><p>No advertising cookies are used. Only technical cookies may be present to ensure the proper functioning of the site, without personalised tracking.</p>
                    <h2>Your rights</h2><p>If you have sent us information by e-mail, you may request to consult, modify or delete it by writing to: <a href="mailto:promom2sc@gmail.com">promom2sc@gmail.com</a>.</p>
                    <h2>Updates</h2><p>This policy may be updated at any time to reflect changes to the site or to legal obligations. The most recent version is always available on this page.</p>
                    <hr><p class="meta">For any question about this privacy policy, please contact: <a href="mailto:promom2sc@gmail.com">promom2sc@gmail.com</a>.</p>
                </div>

                    <p>Ces politiques expliquent comment le site LIBTECH recueille, utilise et protège les informations concernant ses visiteurs. Elle vise à garantir la transparence et le respect de la réglementation en matière de protection des données personnelles. Elle ne constitue pas un conseil juridique et il est recommandé de solliciter un avis professionnel pour toute question spécifique.</p>
                    <p>LIBTECH est un projet universitaire visant à répertorier des technologies inclusives. Vous pouvez consulter l’intégralité du site sans créer de compte et sans transmettre d’informations personnelles.</p>
                    <h2>Informations recueillies</h2><p>Le site ne collecte aucune donnée personnelle à des fins publicitaires ou commerciales. Des informations techniques telles que l’adresse IP, l’heure de connexion ou la page consultée peuvent être enregistrées automatiquement par le serveur de l’Université de Bordeaux pour des raisons de sécurité et de fonctionnement. LIBTECH n’exploite pas activement ces données et ne les utilise pas à des fins d’analyse individuelle.</p>
